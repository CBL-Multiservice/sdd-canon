rules:
  - id: DS440010
    languages:
      - c
      - cpp
      - csharp
      - ruby
      - rust
      - swift
      - bash
    severity: WARNING
    message: "OpenSSL: Do not hardcode SSL/TLS versions within an application. —
      SSL/TLS version usage should be based on an OS or external configuration."
    metadata:
      source: devskim
      source-rule: DS440010
      source-url: https://github.com/microsoft/DevSkim/blob/main/rules/default/security/cryptography/hardcoded_tls.json
      references:
        - DS440000.md
    pattern-either:
      - pattern-regex: SSLv2?3_method|D?TLSv1_([123]_)?(client_|server_)?method
      - pattern-regex: DTLSv1_listen|SSL_stateless
      - pattern-regex: SSL_(CTX_)?set_(min|max)_proto_version
      - pattern-regex: SSL_EXT_TLS_ONLY|SSL_EXT_DTLS_ONLY|SSL_EXT_TLS_IMPLEMENTATION_ONLY|SSL_EXT_SSL3_ALLOWED|SSL_EXT_TLS1_2_AND_BELOW_ONLY|SSL_EXT|TLS1_3_ONLY|SSL_EXT_TLS1_2_SERVER_HELLO|SSL_EXT_TLS1_3_SERVER_HELLO
      - pattern-regex: SSL_OP_(NO_(SSLv3|TLSv1|TLSv1_1|TLSv1_2|TLSv1_3|DTLSv1|DTLSv1_2))
      - pattern-regex: SSL_OP_[A-Z0-9_]+
      - pattern-regex: (AES|DH|DHE|ADH|CAMELLIA|EDH|EXP|DES|IDEA|RC4|NULL|GOST|EXP|ECDH|ECDHE|AECDH|PSK|SSL|RSA|TLS)_?([A-Z0-9]+_)+((SHA[0-9]*)|(MD5)|(GOST)[[A-Z0-9\-]*)
