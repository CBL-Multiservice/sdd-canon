rules:
  - id: DS112836
    languages:
      - csharp
    severity: INFO
    message: .NET - Hard-coded SSL/TLS Protocol — .NET - Hard-coded SSL/TLS Protocol
      — Review to ensure that a TLS protocol agility is maintained.
    metadata:
      source: devskim
      source-rule: DS112836
      source-url: https://github.com/microsoft/DevSkim/blob/main/rules/default/security/TLS/tls_sslprotocol.json
      references:
        - DS112835.md
    pattern-either:
      - pattern-regex: \bSslProtocolsExtensions\.Tls11\b
      - pattern-regex: \bSslProtocolsExtensions\.Tls12\b
      - pattern-regex: \bSslProtocols\.Default\b
      - pattern-regex: \b\(SslProtocols\)240\b
      - pattern-regex: \bSslProtocols\.None\b
      - pattern-regex: \b\(SslProtocols\)0\b
      - pattern-regex: \bSslProtocols\.Ssl2\b
      - pattern-regex: \b\(SslProtocols\)12\b
      - pattern-regex: \bSslProtocols\.Ssl3\b
      - pattern-regex: \b\(SslProtocols\)48\b
      - pattern-regex: \bSslProtocols\.Tls\b
      - pattern-regex: \b\(SslProtocols\)192\b
      - pattern-regex: \bSslProtocols\.Tls11\b
      - pattern-regex: \b\(SslProtocols\)768\b
      - pattern-regex: \bSslProtocols\.Tls12\b
      - pattern-regex: \b\(SslProtocols\)3072\b
      - pattern-regex: \bSslProtocols\.Tls13\b
      - pattern-regex: \b\(SslProtocols\)12288\b
