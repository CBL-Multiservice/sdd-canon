rules:
  - id: DS180000
    languages:
      - c
      - cpp
      - csharp
      - ruby
      - rust
      - swift
      - bash
    severity: INFO
    message: Android debug is enabled. — The android:debuggable element is set to
      true, which should be disabled for release builds. — Set
      android:debuggable to false for release builds.
    metadata:
      source: devskim
      source-rule: DS180000
      source-url: https://github.com/microsoft/DevSkim/blob/main/rules/default/security/frameworks/android.json
      references:
        - DS180000.md
    pattern-regex: (?i)true
