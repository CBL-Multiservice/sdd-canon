rules:
  - id: DS112835
    languages:
      - csharp
    severity: INFO
    message: .NET - Hard-coded SSL/TLS Protocol — .NET - Hard-coded SSL/TLS Protocol
      — Review to ensure that a TLS protocol agility is maintained.
    metadata:
      source: devskim
      source-rule: DS112835
      source-url: https://github.com/microsoft/DevSkim/blob/main/rules/default/security/TLS/tls_securityprotocol.json
      references:
        - DS112835.md
    pattern-either:
      - pattern-regex: \bSecurityProtocolType\.Ssl3\b
      - pattern-regex: \b\(SecurityProtocolType\)48\b
      - pattern-regex: \bSecurityProtocolType\.SystemDefault\b
      - pattern-regex: \b\(SecurityProtocolType\)0\b
      - pattern-regex: \b\(SecurityProtocolType\)192\b
      - pattern-regex: \b\(SecurityProtocolType\)768\b
      - pattern-regex: SecurityProtocolType\.Tls[123]?
      - pattern-regex: \b\(SecurityProtocolType\)3072\b
      - pattern-regex: \bSecurityProtocolType\.Tls13\b
      - pattern-regex: \b\(SecurityProtocolType\)12288\b
      - pattern-regex: \bSecurityProtocolTypeExtensions\.Tls11\b
      - pattern-regex: \bSecurityProtocolTypeExtensions\.Tls12\b
      - pattern-regex: \bSecurityProtocolTypeExtensions\.SystemDefault\b
