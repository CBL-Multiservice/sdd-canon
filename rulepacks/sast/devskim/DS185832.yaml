rules:
  - id: DS185832
    languages:
      - c
      - cpp
    severity: WARNING
    message: Banned C function detected (strcpy) — strcpy is frequently dangerous,
      as it will cause a buffer overflow if the source is larger than the
      destination. — Use strcpy_s or strlcpy if possible. If no safe function is
      viable, strcpy/strncpy should be proceeded by conditional checks to verify
      that the source string will fit in the destination with a null termnator.
    metadata:
      source: devskim
      source-rule: DS185832
      source-url: https://github.com/microsoft/DevSkim/blob/main/rules/default/security/api/dangerous_api.json
      references:
        - DS185832.md
    pattern-regex: \bstrcpy\s*\(([^,]+),([^,]+?)\)
