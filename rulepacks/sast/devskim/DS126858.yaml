rules:
  - id: DS126858
    languages:
      - c
      - cpp
      - csharp
      - ruby
      - rust
      - swift
      - bash
    severity: ERROR
    message: Weak/Broken Hash Algorithm — A weak or broken hash algorithm was
      detected. — Consider switching to use SHA-256 or SHA-512 instead.
    metadata:
      source: devskim
      source-rule: DS126858
      source-url: https://github.com/microsoft/DevSkim/blob/main/rules/default/security/cryptography/hash_algorithm.json
      references:
        - DS126858.md
    pattern-regex: (?i)(?<!\bno)(?<!\bno-)(?<!\bno_)(?<!\bdisable_)(MD2|MD4|MD5|RIPEMD|RIPEMD(128|256|160|320)|(SHA0|SHA-0|SHA1|SHA-1))
