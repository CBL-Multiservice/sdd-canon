      source-rule: DS176603
      source-url: https://github.com/microsoft/DevSkim/blob/main/rules/default/security/cryptography/certificate.json
      references:
        - DS181865.md
    pattern-regex: \bOpenSSL::SSL::VERIFY_NONE\b
