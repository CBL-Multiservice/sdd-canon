rules:
  - id: archgen-py-paramiko-auto-add
    pattern: $CLIENT.set_missing_host_key_policy(paramiko.AutoAddPolicy())
    message: AutoAddPolicy aceita QUALQUER host key SSH sem verificação —
      man-in-the-middle no primeiro contato. Use known_hosts/RejectPolicy.
    languages:
      - python
    severity: WARNING
    metadata:
      cwe: CWE-295
      source-rule: bandit B507
      source-url: https://bandit.readthedocs.io/en/latest/plugins/b507_ssh_no_host_key_verification.html
