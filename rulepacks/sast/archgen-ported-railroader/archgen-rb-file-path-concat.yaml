rules:
  - id: archgen-rb-file-path-concat
    pattern-either:
      - pattern: File.read("...#{$X}...")
      - pattern: File.read(<... "..." + $X ...>)
      - pattern: File.open("...#{$X}...")
      - pattern: File.open(<... "..." + $X ...>)
      - pattern: send_file("...#{$X}...")
      - pattern: send_file(<... "..." + $X ...>)
    message: Caminho de arquivo montado por interpolação/concatenação com dado
      externo — path traversal (../../etc/passwd) ou leitura/exposição de
      arquivo arbitrário. Valide contra um diretório base com File.expand_path +
      checagem de prefixo, ou use lista branca de nomes.
    languages:
      - ruby
    severity: ERROR
    metadata:
      cwe: CWE-22
      source-rule: railroader check_file_access
      source-url: https://github.com/david-a-wheeler/railroader/blob/master/lib/railroader/checks/check_file_access.rb
