rules:
  - id: archgen-java-ecb-mode
    pattern: Cipher.getInstance("=~/.*\/ECB\/.*/")
    message: Modo ECB cifra blocos iguais em blocos iguais — padrões do claro vazam
      no cifrado (o clássico pinguim do ECB). Use GCM (AEAD) ou ao menos CBC com
      IV aleatório.
    languages:
      - java
    severity: WARNING
    metadata:
      cwe: CWE-327
      source-rule: codeql java/weak-cryptographic-algorithm (BrokenCryptoAlgorithm.ql)
      source-url: https://github.com/github/codeql/blob/main/java/ql/src/Security/CWE/CWE-327/BrokenCryptoAlgorithm.ql
