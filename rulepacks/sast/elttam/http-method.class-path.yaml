rules:
  - id: http-method.class-path
    message: JAX-RS $METHOD class $PATH1 endpoint $CLASS.$FUNC()
    severity: INFO
    languages:
      - java
    metadata:
      docs: https://docs.oracle.com/javaee/7/api/index.html?javax/ws/rs/$METHOD.html
      category: security
      subcategory: audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      technology:
        - JVM
        - jax-rs
    patterns:
      - pattern-either:
          - pattern-inside: |
              @jakarta.ws.rs.Path($PATH1)
              class $CLASS {
                ...
              }
          - pattern-inside: |
              @javax.ws.rs.Path($PATH1)
              class $CLASS {
                ...
              }
          - pattern-inside: |
              @Path($PATH1)
              class $CLASS {
                ...
              }
      - pattern-not: |
          @$METHOD
          @jakarta.ws.rs.Path($PATH2)
          $RETURNTYPE $FUNC (...) {
            ...
          }
      - pattern-not: |
          @$METHOD
          @javax.ws.rs.Path($PATH2)
          $RETURNTYPE $FUNC (...) {
            ...
          }
      - pattern-not: |
          @$METHOD
          @Path($PATH2)
          $RETURNTYPE $FUNC (...) {
            ...
          }
      - pattern: |
          @$METHOD
          $RETURNTYPE $FUNC (...) {
            ...
          }
      - metavariable-regex:
          metavariable: $METHOD
          regex: (GET|POST|PUT|DELETE|HEAD|OPTIONS)$
