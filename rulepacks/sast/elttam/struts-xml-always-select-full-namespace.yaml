rules:
  - id: struts-xml-always-select-full-namespace
    message: struts.xml using alwaysSelectFullNamespace
    severity: WARNING
    languages:
      - generic
    metadata:
      docs:
        - https://cwiki.apache.org/confluence/display/WW/S2-057
        - https://nvd.nist.gov/vuln/detail/CVE-2018-11776
      category: security
      subcategory: audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      technology:
        - JVM
        - Struts2
    paths:
      include:
        - struts*.xml
    patterns:
      - pattern-inside: |
          <constant $...STUFF />
      - pattern-either:
          - pattern: >
              <constant ... name='struts.mapper.alwaysSelectFullNamespace' ...
              value='$...MODE' ... />
          - pattern: >
              <constant ... name='struts.mapper.alwaysSelectFullNamespace' ...
              value="$...MODE" ... />
          - pattern: >
              <constant ... name="struts.mapper.alwaysSelectFullNamespace" ...
              value='$...MODE' ... />
          - pattern: >
              <constant ... name="struts.mapper.alwaysSelectFullNamespace" ...
              value="$...MODE" ... />
          - pattern: >
              <constant ... value='$...MODE' ...
              name='struts.mapper.alwaysSelectFullNamespace' ... />
          - pattern: >
              <constant ... value='$...MODE' ...
              name="struts.mapper.alwaysSelectFullNamespace" ... />
          - pattern: >
              <constant ... value="$...MODE" ...
              name='struts.mapper.alwaysSelectFullNamespace' ... />
          - pattern: >
              <constant ... value="$...MODE" ...
              name="struts.mapper.alwaysSelectFullNamespace" ... />
      - metavariable-regex:
          metavariable: $...MODE
          regex: (true|1)
