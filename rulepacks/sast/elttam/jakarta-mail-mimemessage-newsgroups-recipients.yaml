rules:
  - id: jakarta-mail-mimemessage-newsgroups-recipients
    languages:
      - java
    severity: INFO
    message: MimeMessage.getRecipients(Message.RecipientType.NEWSGROUPS) used.
      Newsgroups headers may be concatenated and parsed via NewsAddress, which
      silently normalizes malformed values. Review how this data is used.
    metadata:
      cwe:
        - "CWE-20: Improper Input Validation"
      owasp:
        - A04:2021 – Insecure Design
      references:
        - https://elttam.com/blog/jakarta-mail-primitives/
        - https://cwe.mitre.org/data/definitions/20.html
        - https://owasp.org/Top10/A04_2021-Insecure_Design/
      category: security
      subcategory: audit
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: LOW
      technology:
        - java
    patterns:
      - pattern: |
          $MM.getRecipients(MimeMessage.RecipientType.NEWSGROUPS)
      - metavariable-type:
          metavariable: $MM
          type: jakarta.mail.internet.MimeMessage
