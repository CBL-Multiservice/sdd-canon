rules:
  - id: allow-privilege-escalation
    patterns:
      - pattern-either:
          - pattern-inside: |
              containers:
                ...
          - pattern-inside: |
              initContainers:
                ...
      - pattern-not-inside: |
          volumeDevices:
            ...
      - pattern-not-inside: |
          volumeMounts:
            ...
      - pattern-not-inside: |
          env:
            ...
      - pattern-not-inside: |
          ports:
            ...
      - pattern: |
          # https://raw.githubusercontent.com/kubernetes/kubernetes/master/api/openapi-spec/swagger.json
          # `name` is a required field, `image` is not
          name: $NAME
          ...
      - pattern-not: |
          # need to repeat the positive pattern
          name: ...
          ...
          securityContext:
            ...
            allowPrivilegeEscalation: false
    message: "Container $NAME allows for privilege escalation via setuid or setgid
      binaries. Add 'allowPrivilegeEscalation: false' in 'securityContext' to
      prevent this."
    metadata:
      category: security
      subcategory: audit
      likelihood: LOW
      impact: LOW
      confidence: HIGH
      technology:
        - kubernetes
      references:
        - https://kubernetes.io/docs/concepts/policy/pod-security-policy/#privilege-escalation
        - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
        - https://www.kernel.org/doc/Documentation/prctl/no_new_privs.txt
        - https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html#rule-4-add-no-new-privileges-flag
      owasp:
        - A05:2021 - Security Misconfiguration
        - A06:2017 - Security Misconfiguration
        - K01:2022 - Insecure Workload Configurations
    languages:
      - yaml
    severity: WARNING
