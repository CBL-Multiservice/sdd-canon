rules:
  - id: default-properties-devmode
    message: default.properties struts.devMode = $MODE
    severity: WARNING
    languages:
      - generic
    metadata:
      category: security
      subcategory: audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      technology:
        - JVM
        - Struts2
    paths:
      include:
        - default.properties
        - default-properties-devmode.properties
    patterns:
      - pattern: |
          struts.devMode = $MODE
      - metavariable-regex:
          metavariable: $MODE
          regex: (true|1)
