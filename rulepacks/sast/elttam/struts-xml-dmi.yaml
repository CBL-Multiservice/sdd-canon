rules:
  - id: struts-xml-dmi
    message: struts.xml Dynamic Method Invocation
    severity: WARNING
    languages:
      - generic
    metadata:
      docs:
        - https://struts.apache.org/core-developers/action-configuration.html#dynamic-method-invocation
        - https://cwiki.apache.org/confluence/display/WW/S2-019
      category: security
      subcategory: audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      technology:
        - JVM
        - Struts2
    paths:
      include:
        - struts*.xml
    patterns:
      - pattern-either:
          - pattern: >
              <constant ... name='struts.enable.DynamicMethodInvocation' ...
              value='$...MODE' ... />
          - pattern: >
              <constant ... name='struts.enable.DynamicMethodInvocation' ...
              value="$...MODE" ... />
          - pattern: >
              <constant ... name="struts.enable.DynamicMethodInvocation" ...
              value='$...MODE' ... />
          - pattern: >
              <constant ... name="struts.enable.DynamicMethodInvocation" ...
              value="$...MODE" ... />
          - pattern: >
              <constant ... value='$...MODE' ...
              name='struts.enable.DynamicMethodInvocation' ... />
          - pattern: >
              <constant ... value='$...MODE' ...
              name="struts.enable.DynamicMethodInvocation" ... />
          - pattern: >
              <constant ... value="$...MODE" ...
              name='struts.enable.DynamicMethodInvocation' ... />
          - pattern: >
              <constant ... value="$...MODE" ...
              name="struts.enable.DynamicMethodInvocation" ... />
      - metavariable-regex:
          metavariable: $...MODE
          regex: (true|1)
