rules:
  - id: http-method.no-path
    message: JAX-RS $METHOD endpoint $CLASS.$FUNC()
    severity: INFO
    languages:
      - java
    metadata:
      docs: https://docs.oracle.com/javaee/7/api/index.html?javax/ws/rs/$METHOD.html
      category: security
      subcategory: audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      technology:
        - JVM
        - jax-rs
    patterns:
      - pattern-not-inside: |
          @jakarta.ws.rs.Path($PATH1)
          class $CLASS {
            ...
          }
      - pattern-not-inside: |
          @javax.ws.rs.Path($PATH1)
          class $CLASS {
            ...
          }
      - pattern-not-inside: |
          @Path($PATH1)
          class $CLASS {
            ...
          }
      - pattern-inside: |
          class $CLASS {
            ...
          }
      - pattern-not: |
          @$METHOD
          @jakarta.ws.rs.Path($PATH2)
          $RETURNTYPE $FUNC (...) {
            ...
          }
      - pattern-not: |
          @$METHOD
          @javax.ws.rs.Path($PATH2)
          $RETURNTYPE $FUNC (...) {
            ...
          }
      - pattern-not: |
          @$METHOD
          @Path($PATH2)
          $RETURNTYPE $FUNC (...) {
            ...
          }
      - pattern: |
          @$METHOD
          $RETURNTYPE $FUNC (...) {
            ...
          }
      - metavariable-regex:
          metavariable: $METHOD
          regex: (GET|POST|PUT|DELETE|HEAD|OPTIONS)$
