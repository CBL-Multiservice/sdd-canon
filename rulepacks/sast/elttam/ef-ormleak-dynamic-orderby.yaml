rules:
  - id: ef-ormleak-dynamic-orderby
    message: Dynamic OrderBy using string/expression. If understanding of property
      paths is attacker-controlled, this can aid schema inference and leaks.
    metadata:
      cwe:
        - "CWE-203: Observable Discrepancy"
      owasp:
        - A01:2021 - Broken Access Control
      references:
        - https://cwe.mitre.org/data/definitions/203.html
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
        - https://www.elttam.com/blog/leaking-more-than-you-joined-for/
      category: security
      technology:
        - csharp
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
    severity: INFO
    languages:
      - csharp
    pattern-either:
      - pattern: $Q.OrderBy($ARG)
      - pattern: $Q.OrderByDescending($ARG)
    metavariable-pattern:
      metavariable: $ARG
      pattern-not: '"..."'
