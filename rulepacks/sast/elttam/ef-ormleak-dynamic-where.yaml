rules:
  - id: ef-ormleak-dynamic-where
    message: Dynamic Where clause or expression tree construction. Review whether
      query structure (property paths/operators) can be influenced by user
      input.
    severity: INFO
    metadata:
      cwe:
        - "CWE-203: Observable Discrepancy"
      owasp:
        - A01:2021 - Broken Access Control
      references:
        - https://cwe.mitre.org/data/definitions/203.html
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
        - https://www.elttam.com/blog/leaking-more-than-you-joined-for/
      category: security
      technology:
        - csharp
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
    languages:
      - csharp
    pattern-either:
      - pattern: $Q.Where($EXPR)
      - pattern: $Q.Where($LAMBDA)
    metavariable-pattern:
      metavariable: $EXPR
      pattern-not: $X => $X.$PROP $OP $VAR
