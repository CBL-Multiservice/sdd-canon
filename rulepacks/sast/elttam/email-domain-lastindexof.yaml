rules:
  - id: email-domain-lastindexof
    languages:
      - java
    severity: WARNING
    message: Domain derived via substring(lastIndexOf("@") + 1). This can be tricked
      by overloaded or encoded email addresses. Prefer a proper parser and
      canonical form instead of manual substring logic.
    metadata:
      cwe:
        - "CWE-20: Improper Input Validation"
      owasp:
        - A04:2021 – Insecure Design
      references:
        - https://elttam.com/blog/jakarta-mail-primitives/
        - https://cwe.mitre.org/data/definitions/20.html
        - https://owasp.org/Top10/A04_2021-Insecure_Design/
      category: security
      subcategory: audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      technology:
        - java
    pattern: $EMAIL.substring($EMAIL.lastIndexOf("@") + 1)
