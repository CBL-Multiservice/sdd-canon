rules:
  - id: django-orm-dynamic-orderby-or-values
    message: Dynamic field names used in order_by() or values(). Review if an
      attacker can influence the selected or sorted fields.
    severity: INFO
    metadata:
      cwe:
        - "CWE-203: Observable Discrepancy"
      owasp:
        - A01:2021 - Broken Access Control
      references:
        - https://cwe.mitre.org/data/definitions/203.html
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
        - https://www.elttam.com/blog/plormbing-your-django-orm/
      category: security
      technology:
        - python
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
    languages:
      - python
    patterns:
      - pattern-either:
          - pattern: $QS.order_by(..., $ARG, ...)
          - pattern: $QS.values(..., $ARG, ...)
      - metavariable-pattern:
          metavariable: $ARG
          patterns:
            - pattern-not: '"..."'
