rules:
  - id: struts-xml-action-dmi
    message: struts.xml action $...NAME either using Dynamic Method Invocation or
      Wildcard Method feature
    severity: WARNING
    languages:
      - generic
    metadata:
      docs:
        - https://struts.apache.org/core-developers/action-configuration.html#dynamic-method-invocation
        - https://struts.apache.org/core-developers/action-configuration.html#wildcard-method
      category: security
      subcategory: audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      technology:
        - JVM
        - Struts2
    paths:
      include:
        - struts*.xml
    patterns:
      - pattern-either:
          - pattern: |
              <action ... name="$...NAME"
          - pattern: |
              <action ... name='$...NAME'
      - metavariable-regex:
          metavariable: $...NAME
          regex: .*!.*
