rules:
  - id: jakarta-mail-internetaddress-overloaded-ctor
    languages:
      - java
    severity: WARNING
    message: InternetAddress(String, ...) constructors do NOT validate the email
      address. They assign the address field directly. Prefer the single-arg
      constructor + explicit validation.
    metadata:
      cwe:
        - "CWE-20: Improper Input Validation"
      owasp:
        - A04:2021 – Insecure Design
      references:
        - https://elttam.com/blog/jakarta-mail-primitives/
        - https://cwe.mitre.org/data/definitions/20.html
        - https://owasp.org/Top10/A04_2021-Insecure_Design/
      category: security
      subcategory: audit
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: LOW
      technology:
        - java
      vulnerability_class:
        - Improper Validation
    pattern-either:
      - pattern: new jakarta.mail.internet.InternetAddress($ADDR, $PERSONAL)
      - pattern: new jakarta.mail.internet.InternetAddress($ADDR, $PERSONAL, $CHARSET)
